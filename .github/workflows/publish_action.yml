name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    # Publish rides the v2.0-alpha branch for now. When v2 is promoted,
    # switch this to main-only so releases publish from main.
    branches:
      - v2.0-alpha
    paths:
      - "pyproject.toml"

permissions:
  contents: read
  issues: write

jobs:
  publish-node:
    name: Publish custom node to the Comfy registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'jbrick2070' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
