name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    # v2 was promoted on 2026-09-13: main is the branch, and releases publish
    # from it. v2.0-alpha is retired -- kept as a frozen ref so the
    # raw.githubusercontent URLs pinned to it (the registry card icon, the
    # README images) keep resolving, never pushed to again.
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read
  issues: write

jobs:
  publish-node:
    name: Publish custom node to the Comfy registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'jbrick2070' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
