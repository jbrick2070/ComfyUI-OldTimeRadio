<p><i>Orl</i>. Restate qui appesi, miei versi.</p>
<p><i>Ber</i>. Chi è là?</p>
<p>(<i>escono Gloc. ed Edm</i>.)</p>
<p><i>Vil</i>. Immenso errore, signora: <i>cucullus non facit monachum</i>.</p>
<p><i>Mal</i>. <i>M. O. A. I.</i> governa i miei destini?</p>
<p><span style="letter-spacing: 0px"><i>Entra</i> <span style="font-variant:small-caps">Orlando</span> <i>con un foglio</i>.</span></p>
