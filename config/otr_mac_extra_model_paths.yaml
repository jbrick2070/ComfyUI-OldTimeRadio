# OTR Mac addendum -- passed ALONGSIDE the Comfy Desktop generated file, never
# instead of it, and never by editing that file (its own header says
# "Generated by Comfy Desktop -- do not edit manually").
#
# WHY THIS EXISTS: Comfy Desktop's generated mapping has no 'animatediff_models'
# category, so a motion module sitting in the shared models root is invisible to
# ComfyUI-AnimateDiff-Evolved, which then reports "No motion models found" and
# points at its OWN custom_nodes directory instead.
otr_mac_addendum:
  base_path: '/path/to/your/shared/models'
  'animatediff_models': 'animatediff_models/'
  'animatediff_motion_lora': 'loras/'
