# OTR v2 audio-engine profiles (plan D5 / Wave 0 piece 8).
#
# One row per (role, engine). Curated per-engine default_params live HERE -- not
# in the delivery layer. The resolver (nodes/_otr_engine_profiles.py) loads this
# lazily (cached, exception-wrapped) and keys its in-process cache on the
# file text hash. Engine names MUST match the
# audio-engine registry. The model-backed defaults are the shipped out-of-box
# default per role: IndexTTS2 voice and Stable Audio 3 music. With no permanent
# legacy fallback, a render fails closed with a NAMED error until that engine's
# deps/weights are installed (C-7); model_path stays empty until F pins it.
#
# license_state (clean|gated|unknown; blank = derive from commercial_clean) is
# declarative metadata and never changes dispatch. It MIRRORS commercial_clean
# here -- final license sign-off is Sprint 6, not an unattended flip.

profiles:
  # --- character voice ---
  # Shipped default is indextts2 (engine default_roles); chatterbox and bark
  # stay selectable, bark as a fully byte-identical in-graph engine.
  - profile_id: char_bark_v1
    role: char_voice
    engine: bark
    commercial_clean: false        # Suno Bark terms not confirmed for commercial use
    model_path: ""
    # Per-stage temps (2026-06-17 whiny-voice fix): semantic stays warm (0.7) for
    # content commitment; coarse/fine acoustics drop to 0.5 to firm up the thin/
    # whiny timbre. text_temp/waveform_temp are kept as legacy ALIASES (semantic
    # falls back to text_temp; coarse/fine fall back to waveform_temp). The
    # explicit per-stage keys win when present. normalize_bark_output stays false:
    # EpisodeAssembler already applies the final -1.0 dBFS pass post-crossfade, so
    # a Bark-side peak normalize would double-hit (S4 decision; not implemented).
    # recommended_speakers (S3 DATA only -- NO auto-filter consumer yet): the
    # fullest / least-thin v2/en presets by RMS+LUFS from the 2026-06-17 audition
    # -- en_speaker_5
    # (LUFS -14.3) + en_speaker_0 (-16.8) lead the pack by ~10 dB; en_speaker_6 is
    # the next fullest. Casting enforcement is a FUTURE casting-layer sprint.
    default_params: {semantic_temp: 0.7, coarse_temp: 0.5, fine_temp: 0.5, text_temp: 0.7, waveform_temp: 0.7, normalize_bark_output: false, recommended_speakers: [v2/en_speaker_5, v2/en_speaker_0, v2/en_speaker_6]}
    allowed_voice_banks: [bark_legacy]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: gated            # mirrors commercial_clean=false (verify S6)

  - profile_id: char_chatterbox_v1
    role: char_voice
    engine: chatterbox
    commercial_clean: true         # MIT
    model_path: ""
    default_params: {exaggeration: 0.5, cfg_weight: 0.4, temperature: 0.6}
    # default_clean = the commercial-clean cast bank (2026-06-18 voice roundtable):
    # selecting it routes _resolve_char_engine to chatterbox (MIT) -- the release-
    # safe char cloner -- because indextts2 is excluded from default_clean.
    allowed_voice_banks: [default, default_clean]
    # Voice identity: one seed per CHARACTER per episode, not one per line -- a
    # cloned character must not change voice between his own beats.
    # engine_impl_version moves with the seed policy so audio rendered under the
    # per-line seed is never replayed as if it were this one.
    character_stable_seed: true
    engine_impl_version: "2"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean

  - profile_id: char_indextts2_v1
    role: char_voice
    engine: indextts2
    commercial_clean: false        # Bilibili license -- non-commercial use gated
    model_path: ""
    # THE ADAPTER OWNS THE EMOTION BLEND, NOT THIS FILE. `emo_alpha` below is a
    # cache-key declaration, not a runtime authority: `emotion_payload` resolves
    # alpha and the mass ceiling from the environment or from the constants in
    # `nodes/_otr_audio_engines/eng_indextts2.py`, and `_begin_line_runtime`
    # merges `render_time_params()` LAST, so whatever is written here is
    # overwritten before it reaches a render. It is kept truthful rather than
    # deleted because a reader will look here first.
    #
    # There is deliberately NO `emo_mass_cap` key. The ceiling is the knob that
    # actually governs (EFFECTIVE_EMOTION_MASS_CAP = 0.56), and declaring it
    # here would create a second apparent source of truth that silently does
    # nothing -- the evidence-shaped field this repo refuses everywhere else.
    #
    # emo_alpha is 1.0, a pass-through: the ceiling owns the emotion budget
    # alone, so the budget has exactly one owner.
    default_params: {temperature: 0.8, emo_alpha: 1.0}
    allowed_voice_banks: [default]
    # Voice identity: one seed per CHARACTER per episode, not one per line -- a
    # cloned character must not change voice between his own beats.
    # engine_impl_version moves with the seed policy so audio rendered under the
    # per-line seed is never replayed as if it were this one.
    #
    # engine_impl_version 3: the shipped blend (alpha 1.0 / ceiling 0.56)
    # changes what every character line sounds like. The cache is already
    # correct without the bump -- `render_time_params` puts both resolved values
    # in the key, proven by `tests/test_lemmy_emo_alpha_cache_key.py` -- so it
    # buys no invalidation; it is the profile's declared statement that the
    # engine's behaviour changed.
    character_stable_seed: true
    engine_impl_version: "3"
    sample_rate: 22050
    requires_hf_token: false        # weights are downloadable; only commercial USE is gated
    # The weights carry the bilibili Model Use License (not Apache-2.0). Local
    # and personal use is fine; commercial use is conditioned and
    # community-ambiguous, so confirm with bilibili (indexspeech@bilibili.com)
    # before a commercial release. Do not use them to train other commercial
    # AI models.
    license_state: gated            # bilibili Model Use License (verify S6)

  # --- announcer voice ---
  - profile_id: announcer_kokoro_v1
    role: announcer_voice
    engine: kokoro
    commercial_clean: true         # Apache-2.0
    model_path: ""
    default_params: {speed: 0.95}   # matches the shipped announcer cadence
    allowed_voice_banks: [kokoro_builtin]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean

  # --- character voice (opt-in 2026-06-19): kokoro as a FAST char voice. NOT the
  # char default (indextts2/bark stay default -> byte-identical); selected only
  # when char_voice_engine=kokoro (e.g. a fast soak lane). Preset voices via the
  # kokoro_builtin bank, no reference clip. ---
  - profile_id: char_kokoro_v1
    role: char_voice
    engine: kokoro
    commercial_clean: true         # Apache-2.0
    model_path: ""
    default_params: {speed: 0.95}
    allowed_voice_banks: [kokoro_builtin]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean

  - profile_id: announcer_chatterbox_v1
    role: announcer_voice
    engine: chatterbox
    commercial_clean: true         # MIT
    model_path: ""
    default_params: {exaggeration: 0.4, cfg_weight: 0.4, temperature: 0.6}
    allowed_voice_banks: [default]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean

  # Bark as an announcer alternative (2026-08-24). Bark is preset-driven
  # (P2.2: no bank rows, ever -- see apple/TTS_VOICE_PREFLIGHT.md), so this
  # mirrors char_bark_v1's params exactly rather than the bank-backed
  # profiles above it. The announcer's v2/* preset is drawn by
  # OTR_CastLock._assign_bark_voices, same owner as character Bark casting,
  # excluding whatever presets the characters already drew that episode.
  - profile_id: announcer_bark_v1
    role: announcer_voice
    engine: bark
    commercial_clean: false        # Suno Bark terms not confirmed for commercial use
    model_path: ""
    default_params: {semantic_temp: 0.7, coarse_temp: 0.5, fine_temp: 0.5, text_temp: 0.7, waveform_temp: 0.7, normalize_bark_output: false}
    allowed_voice_banks: [bark_legacy]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: gated            # mirrors commercial_clean=false

  # --- music ---
  - profile_id: music_musicgen_v1
    role: music
    engine: musicgen
    commercial_clean: false        # CC-BY-NC-4.0 -- non-commercial
    model_path: ""
    default_params: {guidance_scale: 3.0, temperature: 1.0}
    allowed_voice_banks: []
    engine_impl_version: "1"
    sample_rate: 32000
    requires_hf_token: false
    license_state: gated            # CC-BY-NC (non-commercial)

  - profile_id: music_stable_audio_v1
    role: music
    engine: stable_audio_music
    commercial_clean: true         # Stability Community license (revenue-capped)
    model_path: ""
    default_params: {steps: 100, seconds_total: 30}
    allowed_voice_banks: []
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: true         # stable-audio-open-1.0 weights are HF-gated
    license_state: clean            # mirrors commercial_clean=true; plan flags revenue-cap review (S6)

  - profile_id: music_stable_audio_3_v1
    role: music
    engine: stable_audio_3
    commercial_clean: true         # SA3 community license -- commercial use OK
    model_path: ""
    default_params: {steps: 100, seconds_total: 30, sampler: dpmpp_3m_sde_gpu, scheduler: exponential}
    allowed_voice_banks: []
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: false        # Comfy-Org/stable-audio-3 is UNgated (free download)
    license_state: clean            # SA3 community license: commercial OK (verify exact model S6)

  # --- cloud ElevenLabs voice (cloud-audio 2026-07-03; dropdown-opt-in, Comfy
  # Cloud via invoke_partner_node). NEVER a default; fail-loud, no local
  # fallback. Voice identity is the provider_voice_id on the
  # cast entry (C3), resolved from the elevenlabs_cloud bank (S2 pool). ---
  - profile_id: char_elevenlabs_cloud_v1
    role: char_voice
    engine: cloud_elevenlabs
    commercial_clean: true          # library premade voices, ToS-clean (S2 pool)
    model_path: ""
    default_params: {stability: 0.5}
    allowed_voice_banks: [elevenlabs_cloud]
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: false
    license_state: clean

  - profile_id: announcer_elevenlabs_cloud_v1
    role: announcer_voice
    engine: cloud_elevenlabs
    commercial_clean: true
    model_path: ""
    default_params: {stability: 0.5}
    allowed_voice_banks: [elevenlabs_cloud]
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: false
    license_state: clean

  # --- direct Google Gemini TTS voice (BYO API key, not Comfy Partner cloud).
  # Explicit-selection-only. Fail-loud, no local/cross-provider fallback.
  # Voice identity is the Google prebuilt voice name in provider_voice_id,
  # resolved from google_tts bank entries by CastLock auto_registry. Gemini TTS
  # is a preview model and its voice stability may vary (hence use_cache on
  # both rows).
  - profile_id: char_google_tts_v1
    role: char_voice
    engine: google_tts
    commercial_clean: true
    model_path: ""
    default_params: {model: gemini-3.8-flash-tts}
    allowed_voice_banks: [google_tts]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean
    use_cache: true

  - profile_id: announcer_google_tts_v1
    role: announcer_voice
    engine: google_tts
    commercial_clean: true
    model_path: ""
    default_params: {model: gemini-3.8-flash-tts}
    allowed_voice_banks: [google_tts]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    license_state: clean
    use_cache: true

  # --- cloud Sonilo MUSIC (cloud-audio S5, 2026-07-03; dropdown-opt-in, Comfy
  # Cloud via invoke_partner_node). NEVER a default; fail-loud, no local
  # fallback. Provider-native duration; ONE music profile maps
  # to all cue types (open/close/inter), stamped per-episode as meta.music_engine
  # (C9). ---
  - profile_id: music_sonilo_cloud_v1
    role: music
    engine: sonilo
    commercial_clean: true          # Sonilo library service, ToS commercial-clean
    model_path: ""
    default_params: {}
    allowed_voice_banks: []
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: false
    license_state: clean

  # --- direct Google Lyria MUSIC (BYO API key, not Comfy Partner cloud).
  # Explicit-selection-only. Lyria 3 Clip returns a fixed 30-second MP3; the
  # adapter sends only model/input to Google, decodes MP3 locally, and trims to
  # the OTR cue length. Paid-only and currently a preview model.
  - profile_id: music_google_lyria_v1
    role: music
    engine: google_lyria
    commercial_clean: true
    model_path: ""
    default_params: {model: lyria-3-clip-preview}
    allowed_voice_banks: []
    engine_impl_version: "1"
    sample_rate: 44100
    requires_hf_token: false
    license_state: clean
