# OTR v2 audio-engine profiles (plan D5 / Wave 0 piece 8).
#
# One row per (role, engine). Curated per-engine default_params live HERE -- not
# in the delivery layer. The resolver (nodes/_otr_engine_profiles.py) loads this
# lazily (cached, exception-wrapped) and hashes the file text into the
# engine_profile source sha (a re-baseline trigger). Engine names MUST match the
# audio-engine registry. The model-backed defaults are now the shipped out-of-box
# default per role: IndexTTS2 voice (PROMOTED 2026-06-04) and Stable Audio 3 music
# (PROMOTED 2026-06-03). With no permanent legacy fallback, a render fails closed
# with a NAMED error until that engine's deps/weights are installed (C-7);
# model_path / model_sha256 stay empty until F pins them.
#
# Sprint-1 declarative metadata (additive; never changes live byte-identical
# dispatch): rank (fallback priority, lower = tried first), is_default (the
# scope/logical default for the role -- distinct from the engine-level live
# default, which stays on the legacy engine until promotion S6), runtime
# (in_graph | oop_venv | cloud | direct_api), needs_ref_clip, caps, license_state
# (clean|gated|unknown; blank = derive from commercial_clean), warn_text
# (non-blocking notice emitted when gated). license_state MIRRORS
# commercial_clean here -- final license sign-off is Sprint 6, not an
# unattended flip.
profile_schema_version: "1"

profiles:
  # --- character voice ---
  # Shipped default is indextts2 (engine default_roles + rank 1), PROMOTED
  # 2026-06-04. The rank chain falls indextts2 -> chatterbox -> bark; bark stays
  # selectable as a fully byte-identical in-graph fallback.
  - profile_id: char_bark_v1
    role: char_voice
    engine: bark
    commercial_clean: false        # Suno Bark terms not confirmed for commercial use
    model_path: ""
    model_sha256: ""
    # Per-stage temps (2026-06-17 whiny-voice fix): semantic stays warm (0.7) for
    # content commitment; coarse/fine acoustics drop to 0.5 to firm up the thin/
    # whiny timbre. text_temp/waveform_temp are kept as legacy ALIASES (semantic
    # falls back to text_temp; coarse/fine fall back to waveform_temp). The
    # explicit per-stage keys win when present. normalize_bark_output stays false:
    # EpisodeAssembler already applies the final -1.0 dBFS pass post-crossfade, so
    # a Bark-side peak normalize would double-hit (S4 decision; not implemented).
    # recommended_speakers (S3 DATA only -- NO auto-filter consumer yet): the
    # fullest / least-thin v2/en presets by RMS+LUFS from the 2026-06-17 audition
    # (docs/2026-06-17-bark-voice/audition/preset_audition.csv) -- en_speaker_5
    # (LUFS -14.3) + en_speaker_0 (-16.8) lead the pack by ~10 dB; en_speaker_6 is
    # the next fullest. Casting enforcement is a FUTURE casting-layer sprint.
    default_params: {semantic_temp: 0.7, coarse_temp: 0.5, fine_temp: 0.5, text_temp: 0.7, waveform_temp: 0.7, normalize_bark_output: false, recommended_speakers: [v2/en_speaker_5, v2/en_speaker_0, v2/en_speaker_6]}
    allowed_voice_banks: [bark_legacy]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    rank: 3                         # char fallback-only (never the scope default)
    is_default: false
    runtime: in_graph
    needs_ref_clip: false           # bark uses speaker presets, not a ref clip
    caps: {emotion_vector: false, duration_control: false}
    license_state: gated            # mirrors commercial_clean=false (verify S6)
    warn_text: "Bark (Suno) weights: commercial terms unconfirmed. Local/personal use OK; verify Suno terms before commercial release."

  - profile_id: char_chatterbox_v1
    role: char_voice
    engine: chatterbox
    commercial_clean: true         # MIT
    model_path: ""
    model_sha256: ""
    default_params: {exaggeration: 0.5, cfg_weight: 0.4, temperature: 0.6}
    # default_clean = the commercial-clean cast bank (2026-06-18 voice roundtable):
    # selecting it routes _resolve_char_engine to chatterbox (MIT) -- the release-
    # safe char cloner -- because indextts2 is excluded from default_clean.
    allowed_voice_banks: [default, default_clean]
    # Voice identity 2026-08-18: one seed per CHARACTER per episode, not
    # one per line -- a cloned character must not change voice between his
    # own beats. engine_impl_version bumped 1 -> 2 in the same change so
    # audio rendered under the per-line seed is never replayed as if it
    # were this one.
    character_stable_seed: true
    engine_impl_version: "2"
    sample_rate: 24000
    requires_hf_token: false
    rank: 2                         # char rank-2 fallback (opt-in)
    is_default: false
    runtime: oop_venv               # Path B isolated worker (MIT; pins own torch)
    needs_ref_clip: true
    caps: {emotion_vector: false, duration_control: false}
    license_state: clean
    warn_text: ""

  - profile_id: char_indextts2_v1
    role: char_voice
    engine: indextts2
    commercial_clean: false        # Bilibili license -- non-commercial use gated
    model_path: ""
    model_sha256: ""
    # THE ADAPTER OWNS THE EMOTION BLEND, NOT THIS FILE. `emo_alpha` below is a
    # cache-key declaration, not a runtime authority: `emotion_payload` resolves
    # alpha and the mass ceiling from the environment or from the constants in
    # `nodes/_otr_audio_engines/eng_indextts2.py`, and `_begin_line_runtime`
    # merges `render_time_params()` LAST, so whatever is written here is
    # overwritten before it reaches a render. It is kept truthful rather than
    # deleted because a reader will look here first.
    #
    # There is deliberately NO `emo_mass_cap` key. The ceiling is the knob that
    # actually governs (EFFECTIVE_EMOTION_MASS_CAP = 0.56), and declaring it
    # here would create a second apparent source of truth that silently does
    # nothing -- the evidence-shaped field this repo refuses everywhere else.
    #
    # emo_alpha re-anchored 0.4 -> 1.0 (2026-08-18). Alpha and the ceiling used
    # to share one job; the ceiling now owns it alone, so alpha is a
    # pass-through and the emotion budget has exactly one owner.
    default_params: {temperature: 0.8, emo_alpha: 1.0}
    allowed_voice_banks: [default]
    # Voice identity 2026-08-18: one seed per CHARACTER per episode, not
    # one per line -- a cloned character must not change voice between his
    # own beats. engine_impl_version bumped 1 -> 2 in the same change so
    # audio rendered under the per-line seed is never replayed as if it
    # were this one.
    #
    # 2 -> 3 (2026-08-18, emotion ceiling): the shipped blend moved from
    # alpha 0.4 / ceiling 0.4 to alpha 1.0 / ceiling 0.56, which changes what
    # every character line sounds like. The cache is already correct without
    # this -- `render_time_params` puts both resolved values in the key, proven
    # by `tests/test_lemmy_emo_alpha_cache_key.py` -- so the bump buys no
    # invalidation. It is here because this field is the profile's declared
    # statement that the engine's behaviour changed, and leaving it at 2 would
    # make that statement false.
    character_stable_seed: true
    engine_impl_version: "3"
    sample_rate: 22050
    requires_hf_token: false        # weights are downloadable; only commercial USE is gated
    rank: 1                         # char scope default (rank-1)
    is_default: true
    runtime: oop_venv               # Path B isolated worker on Blackwell
    needs_ref_clip: true            # identity = reference clip only
    caps: {emotion_vector: true, duration_control: true}
    license_state: gated            # bilibili Model Use License (verify S6)
    warn_text: "IndexTTS2 weights: bilibili Model Use License (not Apache-2.0). Local/personal use OK. Commercial use is conditioned + community-ambiguous -> verify with bilibili (indexspeech@bilibili.com) before commercial release. Do not use to train other commercial AI models."

  - profile_id: char_dia_v1
    role: char_voice
    engine: dia
    commercial_clean: true         # Apache-2.0 -> commercial-clean engine (safe to ship)
    model_path: ""
    model_sha256: ""
    default_params: {}
    # default_clean: dia (Apache-2.0) is the clean-bank PEER of chatterbox; the
    # legacy-first order (chatterbox before dia) means chatterbox wins, dia is the
    # commercial-clean fallback if chatterbox has no usable ref.
    allowed_voice_banks: [default, default_clean]
    # Voice identity 2026-08-18: one seed per CHARACTER per episode, not
    # one per line -- a cloned character must not change voice between his
    # own beats. engine_impl_version bumped 1 -> 2 in the same change so
    # audio rendered under the per-line seed is never replayed as if it
    # were this one.
    character_stable_seed: true
    engine_impl_version: "2"
    sample_rate: 44100             # Descript Audio Codec
    requires_hf_token: false        # nari-labs/Dia-1.6B-0626 weights are ungated
    rank: 2                         # char rank-2 (opt-in; peer of chatterbox)
    is_default: false
    runtime: oop_venv               # Path B isolated worker (torch 2.8 nightly on sm_120)
    needs_ref_clip: true            # zero-shot clone from a reference clip
    caps: {emotion_vector: false, duration_control: false}
    license_state: clean
    warn_text: ""

  # --- announcer voice ---
  - profile_id: announcer_kokoro_v1
    role: announcer_voice
    engine: kokoro
    commercial_clean: true         # Apache-2.0
    model_path: ""
    model_sha256: ""
    default_params: {speed: 0.95}   # matches the shipped announcer cadence (was 1.0; aligned to live behavior, clean-break 1b)
    allowed_voice_banks: [kokoro_builtin]
    engine_impl_version: "1"
    sample_rate: 24000
    requires_hf_token: false
    rank: 1                         # announcer scope default
    is_default: true
    runtime: in_graph
    needs_ref_clip: false
    caps: {emotion_vector: false, duration_control: false}
    license_state: clean
    warn_text: ""

  # --- character voice (opt-in 2026-06-19): kokoro as a FAST char voice. NOT the
