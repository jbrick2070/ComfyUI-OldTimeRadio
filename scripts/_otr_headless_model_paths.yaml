# Headless copy of %APPDATA%\ComfyUI\extra_models_config.yaml.
# Why a copy: the Desktop yaml's desktop_extensions entry points at an install
# that does not exist, and headless main.py crashes on it in
# execute_prestartup_script (FileNotFoundError). This copy keeps the model dirs
# + the Documents custom_nodes mapping (the wrapper packs:
# ComfyUI-AnimateDiff-Evolved, KJNodes, VideoHelperSuite, ...) and omits the
# desktop_extensions section. If the Desktop app moves, refresh this file from
# the Desktop yaml.
comfyui_desktop:
  is_default: true
  base_path: C:/Users/jeffr/Documents/ComfyUI
  download_model_base: C:/ComfyUI-Models
  custom_nodes: custom_nodes/
  checkpoints: C:/ComfyUI-Models/checkpoints/
  text_encoders: |
       C:/ComfyUI-Models/text_encoders/
       C:/ComfyUI-Models/clip/
  clip_vision: C:/ComfyUI-Models/clip_vision/
  configs: C:/ComfyUI-Models/configs/
  controlnet: C:/ComfyUI-Models/controlnet/
  diffusion_models: |
                C:/ComfyUI-Models/diffusion_models
                C:/ComfyUI-Models/unet
  embeddings: C:/ComfyUI-Models/embeddings/
  loras: C:/ComfyUI-Models/loras/
  # TWO ROOTS ON PURPOSE, and the second one is where the weights actually are.
  # C:/ComfyUI-Models/upscale_models/ holds no weights on this box, so alone it
  # leaves the headless UpscaleModelLoader list EMPTY and the `spandrel_esrgan`
  # engine can never load the `real-esrgan-x2plus` its CAPABILITIES row
  # requires. The three RealESRGAN weights live under the Documents models
  # root (the Desktop app's default location). Listing both is additive: it can
  # only turn a false negative into the truth, as `text_encoders` above does.
  upscale_models: |
       C:/ComfyUI-Models/upscale_models/
       C:/Users/jeffr/Documents/ComfyUI/models/upscale_models/
  # canonical IA2V two-stage (2026-07-02): core LatentUpscaleModelLoader reads
  # folder key latent_upscale_models (nodes_hunyuan.py); without this mapping
  # the LTX spatial upscaler enum is EMPTY on headless boots.
  latent_upscale_models: C:/ComfyUI-Models/latent_upscale_models/
  # `animatediff_models` and `sams` are mapped so every local model resolves
  # from C:/ComfyUI-Models (operator: all local models belong there, on the
  # PCIe 5 drive) instead of a copy bundled inside
  # custom_nodes/ComfyUI-AnimateDiff-Evolved/models/. The node registers both
  # that directory AND <models_dir>/animatediff_models (utils_model.py:343-344),
  # and the second resolves under Documents, which holds nothing.
  animatediff_models: C:/ComfyUI-Models/animatediff_models/
  sams: C:/ComfyUI-Models/sams/
  vae: C:/ComfyUI-Models/vae/
  audio_encoders: C:/ComfyUI-Models/audio_encoders/
  model_patches: C:/ComfyUI-Models/model_patches/
