# Headless copy of %APPDATA%\ComfyUI\extra_models_config.yaml (2026-06-12).
# Why a copy: the Desktop yaml's desktop_extensions entry points at the OLD
# v1 install (AppData\Local\Programs\ComfyUI\...) which no longer exists --
# headless main.py crashes in execute_prestartup_script (FileNotFoundError).
# This copy keeps the model dirs + the Documents custom_nodes mapping (the
# wrapper packs: ComfyUI-LTXVideo, KJNodes, VideoHelperSuite, kokorotts, ...)
# and drops the dead desktop_extensions section. If the Desktop app moves
# again, refresh this file from the Desktop yaml.
comfyui_desktop:
  is_default: true
  base_path: C:/Users/jeffr/Documents/ComfyUI
  download_model_base: C:/ComfyUI-Models
  custom_nodes: custom_nodes/
  checkpoints: C:/ComfyUI-Models/checkpoints/
  text_encoders: |
       C:/ComfyUI-Models/text_encoders/
       C:/ComfyUI-Models/clip/
  clip_vision: C:/ComfyUI-Models/clip_vision/
  configs: C:/ComfyUI-Models/configs/
  controlnet: C:/ComfyUI-Models/controlnet/
  diffusion_models: |
                C:/ComfyUI-Models/diffusion_models
                C:/ComfyUI-Models/unet
  embeddings: C:/ComfyUI-Models/embeddings/
  loras: C:/ComfyUI-Models/loras/
  # TWO ROOTS ON PURPOSE (2026-08-19), and the second one is where the weights
  # actually are. This key used to name ONLY C:/ComfyUI-Models/upscale_models/,
  # which on this box contains a `.cache` directory and nothing else -- so the
  # headless server's upscale model list was EMPTY (`/object_info`
  # UpscaleModelLoader reported `options: []`, verified live), and the
  # `spandrel_esrgan` upscale engine could never load the `real-esrgan-x2plus`
  # its CAPABILITIES row requires. A lane that preflights clean and can never
  # load its model is the wan_i2v killer, lesson L1, and it had gone unnoticed
  # because nothing probes an upscaler's weights the way the video gates probe
  # theirs.
  #
  # The three RealESRGAN weights live under the Documents models root -- the
  # Desktop app's default location, which the C:/ComfyUI-Models migration moved
  # every OTHER key away from and this one never followed. Listing both is
  # additive: it can only turn a false negative into the truth, and it matches
  # what `text_encoders` above already does with two roots.
  upscale_models: |
       C:/ComfyUI-Models/upscale_models/
       C:/Users/jeffr/Documents/ComfyUI/models/upscale_models/
  # canonical IA2V two-stage (2026-07-02): core LatentUpscaleModelLoader reads
  # folder key latent_upscale_models (nodes_hunyuan.py); without this mapping
  # the LTX spatial upscaler enum is EMPTY on headless boots.
  latent_upscale_models: C:/ComfyUI-Models/latent_upscale_models/
  vae: C:/ComfyUI-Models/vae/
  audio_encoders: C:/ComfyUI-Models/audio_encoders/
  model_patches: C:/ComfyUI-Models/model_patches/
