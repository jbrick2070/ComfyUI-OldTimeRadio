[project]
name = "comfyui-old-time-radio"
version = "2.3.46"
description = "Press Run once: ComfyUI writes or adapts a radio play, casts and performs it with neural voices, composes the score, and cuts a finished episode video -- all locally. No account, no API key, nothing paid. Needs an NVIDIA card with 8 GB or more, a 16 GB Apple Silicon Mac, or a CPU (start ComfyUI with --cpu), plus about 25 GB of free disk; the first run fetches several GB of models."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# MUST be a STATIC list, kept in sync with requirements.txt by hand. The Comfy
# Registry reads this literal field -- it does NOT evaluate setuptools' dynamic
# resolution, which was proven on an early registry version: `dynamic = ["dependencies"]`
# published with `dependencies: []` recorded, so a registry install still got
# no libraries. Every working pack on the registry declares a static list.
# Torch is deliberately absent: ComfyUI manages its own.
dependencies = [
    "transformers>=5.10.4,<6.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    # The foley speech duck (2026-09-26): a CPU voice-activity gate, then a
    # small Whisper. silero-vad asks only torch>=1.12, which every ComfyUI
    # already has, so pip never replaces ComfyUI's torch; faster-whisper pulls
    # no torch at all. Both are imported lazily -- a missing one means no duck,
    # never a failed episode.
    "silero-vad>=6.0",
    "faster-whisper>=1.1.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    # FLOOR ONLY -- never re-add an upper bound. `<=0.23` EXCLUDES 0.23.1 under
    # PEP 440, while transformers 5.16 requires tokenizers>=0.23.1,<0.24.0. The two
    # are unsatisfiable, and ComfyUI Manager installs requirements ONE LINE AT A TIME
    # so the resolver never saw the conflict -- it silently downgraded tokenizers to
    # 0.22.2, transformers then failed its own import check, and ComfyUI would not
    # start at all (exit 1). Measured on a Mac mini M4, 2026-09-07. transformers owns
    # this constraint; we only keep a floor so the dependency stays declared.
    "tokenizers>=0.22",
    "sentencepiece>=0.1.99",
    # CUDA-only library; no marker here blocked the whole registry install on
    # macOS (2026-09-01 ship audit). The loader already fails loud when bnb is
    # missing while quant_policy demands it.
    "bitsandbytes>=0.42.0; sys_platform != 'darwin'",
    # See requirements.txt for the full note: the loader passes
    # low_cpu_mem_usage / device_map / max_memory / quantization_config, all of
    # which transformers routes through accelerate, yet it was never declared.
    "accelerate>=1.1.0",
    "lm-format-enforcer>=0.11.3,<1.0",
    "spandrel~=0.4.1",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # THE COLD-INSTALL PAIR (2026-08-29). Both were fixed in CODE on 2026-08-29
    # and both were unreachable from a registry install, because the registry
    # reads only this literal list -- the same lesson an earlier pair of versions taught
    # when the setuptools dynamic form recorded dependencies: [].
    #
    # kokoro is the DEFAULT announcer voice in the shipped canonical workflow.
    # Without it a fresh install reaches its FIRST SPOKEN LINE and dies on
    # KPipeline.__init__() got an unexpected keyword argument 'repo_id'.
    # Not installable on Python 3.13 (numpy==1.26.4 pin on 0.7.16; Requires-
    # Python <3.13 on every newer kokoro/misaki). Mirrors requirements.txt.
    "kokoro>=0.7.16; python_version < '3.13'",
    # The English phonemizer's spaCy model (2026-10-30). misaki[en] calls
    # spacy.cli.download -- a `pip install` spawned mid-render -- when
    # en_core_web_sm is absent, and a fresh install lacked it because spaCy
    # publishes the model as a GitHub release wheel, not on PyPI. Declared by
    # URL under the kokoro marker; the engine refuses by name if it is still
    # missing, and never downloads. Mirrors requirements.txt.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; python_version < '3.13'",
    # The SAME kokoro voices on Python 3.13, through ONNX Runtime instead of
    # torch. The engine stays "kokoro" in every dropdown and selects the torch
    # package when that imports, kokoro-onnx otherwise, so the two markers are
    # COMPLEMENTARY: each interpreter gets exactly one backend. The upper bound
    # is real -- kokoro-onnx 0.6.x declares Requires-Python <3.14, and a bare
    # line would repeat PBUG-20260901-04 the day ComfyUI ships 3.14, because pip
    # resolves a requirement set all-or-nothing. Landed in code on 2026-09-02
    # and unreachable from a registry install until this line existed.
    "kokoro-onnx>=0.6.1; python_version >= '3.13' and python_version < '3.14'",
    # The Japanese row's MeCab dictionary (PBUG-20260918-06). misaki[ja] pulls
    # `unidic`, whose wheel contains a DOWNLOADER and no dictionary, so a
    # registry install reaches its first Japanese line and dies in
    # fugashi.Tagger() on a mecabrc that was never fetched. unidic-lite carries
    # its dictionary inside the wheel -- nothing is downloaded at render time.
    # Exactly the cold-install shape this block exists for: the fix landed in
    # requirements.txt and in code the same day and was unreachable from a
    # registry install until this line existed.
    "unidic-lite>=1.0.8",
    # The Japanese and Mandarin phonemizer libraries for the ONNX Kokoro on
    # Python 3.13 (2026-09-29): the pack's copy of misaki's code needs them,
    # and until this line a fresh Desktop or portable install refused those
    # two languages at Run. Same marker as kokoro-onnx. Mirrors requirements.txt.
    "fugashi>=1.5; python_version >= '3.13' and python_version < '3.14'",
    "jaconv>=0.4; python_version >= '3.13' and python_version < '3.14'",
    "jieba>=0.42; python_version >= '3.13' and python_version < '3.14'",
    "pypinyin>=0.50; python_version >= '3.13' and python_version < '3.14'",
    "cn2an>=0.5.22; python_version >= '3.13' and python_version < '3.14'",
    "ordered-set>=4.1; python_version >= '3.13' and python_version < '3.14'",
    # pyloudnorm is imported by scene_sequencer to master every episode to
    # -14 LUFS. Its import is try/except with a deliberate fallback, so a
    # missing install does not crash -- it quietly ships a differently
    # mastered, quieter episode and says so only in one warning line. That
    # silence is why it went unnoticed for so long.
    "pyloudnorm>=0.1.1",
    # Imported by shipped nodes, declared only in requirements.txt until
    # 2026-09 (Pillow 16 unguarded sites; aiohttp in __init__.py).
    #
    # pycairo is WINDOWS-ONLY since 2026-09, and the reason is this card's
    # node count. pycairo publishes 21 Windows wheels, 1 sdist and zero Linux
    # wheels, so on Linux pip must build from source against libcairo2-dev.
    # Comfy-Org's node-pack-extract boots a headless CPU ComfyUI in a Linux
    # container under `set -e`, installs this pack's requirements, and reads
    # /object_info to publish the node list that Algolia renders as "N Nodes";
    # the build failure killed that boot, which is why
    # an earlier version's /comfy-nodes returned
    # {"comfy_nodes": null, "totalNumberOfPages": 0} while a working pack
    # returns rows. That extractor is independent of Flagged/Active status.
    #
    # Measured cost: one function. The only `import cairo` in scope_draw.py is
    # inside `paint_mandala`, so importing the module never imports cairo, and
    # cfr_flags / find_ffmpeg / encode_silent_mp4 are all cairo-free --
    # caption burn, the silent composite and the encode sink are untouched.
    # eng_viz_mandala guards load() and assert_usable() and
    # raises EngineUnusable naming the pip command, and viz_mxc_mandala appears
    # zero times in workflows/otr_canonical.json. The Linux pod keeps the engine
    # because scripts/otr_pod_provision.sh apt-installs the headers and then
    # pip-installs pycairo explicitly.
    "pycairo>=1.24; sys_platform == 'win32'",
    "pillow>=10.0",
    "aiohttp>=3.9",
    # ffmpeg as a pip dependency (2026-09-07). Before this, a finished episode
    # died at the mp4 encode with a `winget install ffmpeg` RuntimeError -- on
    # macOS. imageio-ffmpeg ships prebuilt ffmpeg wheels for Windows, Linux and
    # macOS (arm64 + x86_64), so `pip install` alone now yields a working
    # encoder everywhere. Resolved LAST, after OTR_FFMPEG / PATH / real system
    # installs, so boxes that already work are untouched.
    "imageio-ffmpeg>=0.5",
    # PyAV: what the pack measures media with on a box that has ffmpeg and no
    # ffprobe (_otr_shared/ffprobe.py, 2026-09-11). ComfyUI core pins av>=17
    # itself; declared here so the pack states its own need.
    "av>=17.0.0",
    # NVIDIA RTX Video Super Resolution's runtime for the rtx_vsr upscaler
    # (2026-10-30), declared as Comfy-Org's own ComfyUI_Nvidia_VFX_Nodes
    # declares it, instead of pip-installed by the engine at run time (the
    # registry flagged 2.3.34/2.3.35 "code-install" for that,
    # PBUG-20261030-01). A wheel-stub on PyPI resolving NVIDIA's ~540 MB wheel
    # from pypi.nvidia.com; the marker is the set of platforms that wheel
    # exists for, because the stub fails the whole install anywhere else.
    # Mirrors requirements.txt.
    "nvidia-vfx>=0.2,<0.3; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]
authors = [
    {name = "Jeffrey Brick", email = "jbrick2070@gmail.com"},
]
keywords = ["comfyui", "comfyui-nodes", "comfyui-custom-node", "text-to-speech", "tts", "radio-drama", "audio-drama", "old-time-radio", "story-generation", "music-generation", "video-generation", "local-ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # The registry reads OS classifiers to help people find a pack that fits
    # their machine (registry specification). NO ACCELERATOR CLASSIFIER, ON
    # PURPOSE (operator, 2026-10-30): ComfyUI-Manager's version picker compares
    # the machine's short device name ("CUDA", "Metal", "ROCm", "CPU") against
    # the registry's string ("GPU :: NVIDIA CUDA") as an exact match -- open
    # frontend issue 15364, fix PR 15468 unmerged, frontend 1.59 has the bug --
    # so ANY declared accelerator made every machine, CUDA boxes included, read
    # "GPU/Accelerator not supported" (2.3.38 to 2.3.45 declared CUDA alone).
    # An empty list is treated as unrestricted. The pack runs on CUDA, Apple
    # Metal, AMD ROCm and CPU; put `Environment :: GPU :: NVIDIA CUDA`,
    # `:: Apple Metal` and `:: AMD ROCm` back the day that fix ships, for the
    # registry's search tags.
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio"
Repository = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio"
Issues = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio/issues"
Documentation = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio#readme"

[tool.comfy]
PublisherId = "fluxus"
DisplayName = "Old-Time Radio"
# Registry card art, as URLs -- the raw GitHub path on the publish branch, so
# editing a file updates the LIVE listing with no version bump. The registry
# specification: Icon is square, at most 400x400 (SVG/PNG/JPG/GIF); Banner is
# 21:9. Both show on the registry page and in ComfyUI-Manager. The card is hand-finished; there is no
# generator for it. No node or bank COUNT goes on the art (operator,
# 2026-09-21) -- it was wrong and it rots.
Icon = "https://raw.githubusercontent.com/jbrick2070/ComfyUI-OldTimeRadio/main/assets/otr_icon_400.png"
Banner = "https://raw.githubusercontent.com/jbrick2070/ComfyUI-OldTimeRadio/main/assets/otr_banner.jpg"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# Set explicitly per pytest-asyncio's recommendation -- otherwise the
# plugin emits PytestDeprecationWarning at import time that
# `asyncio_default_fixture_loop_scope` is unset. Classified as third-
# party (pytest-asyncio plugin internal) in S27 QA-5; configuring it
# explicitly is the upstream-recommended fix. Closes BUG-LOCAL-221.
asyncio_default_fixture_loop_scope = "function"

[tool.pytest.ini_options.markers]
bug_bible = "Bug Bible regression tests from survival guide"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
