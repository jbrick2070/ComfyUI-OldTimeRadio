[project]
name = "comfyui-old-time-radio"
version = "2.0.0-alpha.13"
description = "Fully local old-time radio drama generator for ComfyUI — writes episode scripts, performs them with multi-voice neural TTS, masters 48kHz audio, and renders companion video. No cloud services required."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# MUST be a STATIC list, kept in sync with requirements.txt by hand. The Comfy
# Registry reads this literal field -- it does NOT evaluate setuptools' dynamic
# resolution, which was proven on 2.0.0-alpha.3: `dynamic = ["dependencies"]`
# published with `dependencies: []` recorded, so a registry install still got
# no libraries. Every working pack on the registry declares a static list.
# Torch is deliberately absent: ComfyUI manages its own.
dependencies = [
    "transformers>=5.10.4,<6.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "tokenizers>=0.22,<=0.23",
    "sentencepiece>=0.1.99",
    "bitsandbytes>=0.42.0",
    # See requirements.txt for the full note: the loader passes
    # low_cpu_mem_usage / device_map / max_memory / quantization_config, all of
    # which transformers routes through accelerate, yet it was never declared.
    "accelerate>=1.1.0",
    "lm-format-enforcer>=0.11.3,<1.0",
    "spandrel~=0.4.1",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]
authors = [
    {name = "Jeffrey Brick", email = "jbrick2070@gmail.com"},
]
keywords = ["comfyui", "tts", "radio", "bark", "gemma", "audio", "sci-fi", "spatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Artistic Software",
]

[project.urls]
Homepage = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio"
Repository = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio"
Issues = "https://github.com/jbrick2070/ComfyUI-OldTimeRadio/issues"

[tool.comfy]
PublisherId = "fluxus"
DisplayName = "ComfyUI-OldTimeRadio"
# Registry card art. Must be a URL (SVG/PNG/JPG/GIF, max 800x400) -- the raw
# GitHub path on the publish branch. Regenerate with tools/make_registry_icon.py.
Icon = "https://raw.githubusercontent.com/jbrick2070/ComfyUI-OldTimeRadio/v2.0-alpha/assets/otr_icon.gif"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# Set explicitly per pytest-asyncio's recommendation -- otherwise the
# plugin emits PytestDeprecationWarning at import time that
# `asyncio_default_fixture_loop_scope` is unset. Classified as third-
# party (pytest-asyncio plugin internal) in S27 QA-5; configuring it
# explicitly is the upstream-recommended fix. Closes BUG-LOCAL-221.
asyncio_default_fixture_loop_scope = "function"

[tool.pytest.ini_options.markers]
bug_bible = "Bug Bible regression tests from survival guide"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
