<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Play Studio</title>
<style>
  :root {
    --bg: #f4efe6; --panel: #fffdf8; --ink: #2a2118; --muted: #6f6254;
    --line: #d9ccb8; --accent: #b4491f; --accent-ink: #fff8f0; --ok: #2f6b3a; --bad: #a3261a;
    --bar: #e5d9c5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f; --panel: #211b15; --ink: #f0e6d6; --muted: #a89a86;
      --line: #3a3026; --accent: #e0703f; --accent-ink: #1a1007; --ok: #7ec28a; --bad: #f08a7e;
      --bar: #3a3026;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: .02em; }
  .tag { color: var(--muted); margin: 0 0 24px; }
  fieldset { border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
             padding: 16px; margin: 0 0 16px; }
  legend { padding: 0 8px; font-weight: bold; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  .help { color: var(--muted); font-size: .875rem; margin: 2px 0 0; }
  select, input, textarea { width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 72px; resize: vertical; }
  button { font: inherit; font-weight: bold; padding: 12px 22px; border: 0; border-radius: 8px;
           background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #bar { height: 10px; background: var(--bar); border-radius: 5px; overflow: hidden; margin: 12px 0 6px; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  #status { color: var(--muted); min-height: 1.5em; }
  #error { color: var(--bad); white-space: pre-wrap; }
  #notice { color: var(--bad); }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 12px; }
  .done a { color: var(--ok); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 16px; }
  @media (max-width: 560px) { .modes { grid-template-columns: 1fr; } }
  .mode { display: block; margin: 0; padding: 14px 16px; border: 2px solid var(--line);
          border-radius: 10px; background: var(--panel); cursor: pointer; font-weight: normal; }
  .mode strong { display: block; font-size: 1.1rem; }
  .mode span { color: var(--muted); font-size: .875rem; }
  .mode input { width: auto; margin: 0 6px 0 0; }
  .mode:has(input:checked) { border-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Radio Play Studio</h1>
  <p class="tag">Press the button. Your own ComfyUI writes, casts, performs and films a radio play.</p>

  <p id="notice" hidden></p>
  <form id="form"></form>
  <button id="go" type="submit" form="form" disabled>Make the episode</button>

  <section id="run" hidden aria-live="polite">
    <div id="bar"><div id="fill"></div></div>
    <p id="status"></p>
    <p id="error" hidden></p>
    <div id="result" class="done" hidden></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const form = $("form"), go = $("go");
let fields = [];

function control(f) {
  let el;
  if (f.kind === "choice") {
    el = document.createElement("select");
    for (const c of f.choices) {
      const o = document.createElement("option");
      o.value = o.textContent = String(c);
      el.appendChild(o);
    }
    if (f.default != null) el.value = String(f.default);
  } else if (f.kind === "int" || f.kind === "float") {
    el = document.createElement("input");
    el.type = "number";
    if (f.min != null) el.min = f.min;
    if (f.max != null) el.max = f.max;
    el.step = f.kind === "int" ? 1 : "any";
    if (f.default != null) el.value = f.default;
  } else if (f.multiline) {
    el = document.createElement("textarea");
    el.value = f.default || "";
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.value = f.default || "";
  }
  if (f.kind === "text" && f.placeholder) el.placeholder = f.placeholder;   // the pack's own example
  el.id = "f_" + f.key;
  return el;
}

// The bank that reads the four My Story boxes (the pack's own name for it).
const MY_STORY_BANK = "my_story", MY_STORY_GROUP = "My story";
let lastBank = null;

function build(list) {
  fields = list;
  form.textContent = "";
  const boxes = {};
  for (const f of list) {
    if (!boxes[f.group]) {
      const box = document.createElement("fieldset");
      box.id = "group_" + f.group.replace(/\W+/g, "_");
      const lg = document.createElement("legend");
      lg.textContent = f.group;
      box.appendChild(lg);
      boxes[f.group] = box;
    }
    const row = document.createElement("div");
    row.id = "row_" + f.key;
    const label = document.createElement("label");
    label.htmlFor = "f_" + f.key;
    label.textContent = f.label;
    const help = document.createElement("p");
    help.className = "help";
    help.textContent = f.help;
    row.append(label, control(f), help);
    boxes[f.group].appendChild(row);
  }
  const bank = list.find((f) => f.key === "bank");
  const ownStory = boxes[MY_STORY_GROUP] && bank && bank.choices.includes(MY_STORY_BANK);
  if (ownStory) form.appendChild(modeSwitch());
  if (ownStory) form.appendChild(boxes[MY_STORY_GROUP]);
  for (const [name, box] of Object.entries(boxes)) if (!(ownStory && name === MY_STORY_GROUP)) form.appendChild(box);
  if (ownStory) {
    $("f_bank").addEventListener("change", () => setMode($("f_bank").value === MY_STORY_BANK ? "own" : "classic"));
    setMode($("f_bank").value === MY_STORY_BANK ? "own" : "classic");
  }
  go.disabled = false;
}

function modeSwitch() {
  const wrap = document.createElement("div");
  wrap.className = "modes";
  wrap.setAttribute("role", "radiogroup");
  wrap.setAttribute("aria-label", "What story?");
  for (const [mode, title, text] of [
    ["classic", "A classic, or surprise me", "Adapt Shakespeare or a public-domain story, or roll the dice."],
    ["own", "Tell my own story", "Write who is in it, what happens and where. The rest is filled in for you."],
  ]) {
    const card = document.createElement("label");
    card.className = "mode";
    const radio = document.createElement("input");
    radio.type = "radio"; radio.name = "mode"; radio.value = mode; radio.id = "mode_" + mode;
    radio.addEventListener("change", () => setMode(mode));
    const strong = document.createElement("strong");
    strong.append(radio, title);
    const span = document.createElement("span");
    span.textContent = text;
    card.append(strong, span);
    wrap.appendChild(card);
  }
  return wrap;
}

function setMode(mode) {
  const own = mode === "own", bank = $("f_bank");
  $("mode_" + mode).checked = true;
  if (own && bank.value !== MY_STORY_BANK) { lastBank = bank.value; bank.value = MY_STORY_BANK; }
  if (!own && bank.value === MY_STORY_BANK) bank.value = lastBank || bank.options[0].value;
  $("group_" + MY_STORY_GROUP.replace(/\W+/g, "_")).hidden = !own;
  for (const key of ["bank", "source_ref"]) if ($("row_" + key)) $("row_" + key).hidden = own;
}

function collect() {
  const out = {};
  const bank = $("f_bank") ? $("f_bank").value : null;
  for (const f of fields) {
    // The My Story boxes travel only with my_story: the pack stops a run whose
    // hand-picked bank is another one while they hold text, and text left in
    // the hidden boxes must not ride along with a roll the person meant as
    // "surprise me".
    if (f.group === MY_STORY_GROUP && bank !== MY_STORY_BANK) continue;
    // ...and my_story has no classic to adapt: the pack stops a run that names
    // one (_otr_story_input.py), so it is sent empty, over any saved value.
    if (f.key === "source_ref" && bank === MY_STORY_BANK) { out[f.key] = ""; continue; }
    const el = $("f_" + f.key);
    if (f.kind === "text" && el.value === "" ) continue;   // blank = the workflow's own value
    out[f.key] = (f.kind === "int" || f.kind === "float") ? Number(el.value) : el.value;
  }
  return out;
}

async function loadOptions() {
  // A ComfyUI that is busy rendering takes about 40 s to list its nodes.
  $("notice").textContent = "Asking your ComfyUI what it can make... (slower while it is rendering)";
  $("notice").hidden = false;
  try {
    const res = await fetch("/api/options");
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    build(body.fields);
    $("notice").hidden = true;
  } catch (err) {
    $("notice").textContent = "Cannot reach your ComfyUI: " + err.message +
      "  Start ComfyUI, then reload. (python -m radio_play_studio doctor says what is missing.)";
    $("notice").hidden = false;
  }
}

function watch(id) {
  const es = new EventSource("/api/episodes/" + id + "/events");
  let finished = false, high = 0;   // the bar only moves forward
  es.onerror = () => {
    if (finished || es.readyState !== EventSource.CLOSED) return;   // otherwise the browser is reconnecting
    es.close();
    $("error").textContent = "Lost the connection to the app. If you restarted it, the run is no longer tracked here, but it may still be rendering on your ComfyUI; its episode lands in otr/obs.";
    $("error").hidden = false;
    $("status").textContent = "Disconnected.";
    go.disabled = false;
  };
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "progress") {
      high = Math.max(high, Math.round(ev.value * 100));
      $("fill").style.width = high + "%";
      // minutes_left comes from this machine's last run of the same workflow
      const parts = ev.minutes_left != null ? ", about " + ev.minutes_left + " min left"
        : ev.nodes_total ? " (" + ev.nodes_done + " of " + ev.nodes_total + " stages)" : "";
      $("status").textContent = high + "%" + parts + (ev.message ? " " + ev.message : "");
    } else if (ev.type === "step") {
      // one stage's own steps; the bar is the whole episode, so it stays put
      const stage = ev.steps ? "this stage: step " + ev.step + " of " + ev.steps : "";
      $("status").textContent = high + "%" + (stage ? ", " + stage : "");
    } else if (ev.type === "submitted") {
      $("status").textContent = "Queued on your ComfyUI. A full episode takes a while; the bar moves in steps.";
    } else if (ev.type === "status") {
      $("status").textContent = "Status: " + ev.status;
    } else if (ev.type === "done") {
      finished = true;
      es.close();
      $("fill").style.width = "100%";
      $("status").textContent = "Finished.";
      const url = "/episodes/" + ev.run + "/" + encodeURIComponent(ev.file);
      const v = document.createElement("video");
      v.controls = true; v.src = url;
      const a = document.createElement("a");
      a.href = url; a.download = ev.file; a.textContent = "Download " + ev.file;
      $("result").textContent = "";
      $("result").append(v, a);
      $("result").hidden = false;
      go.disabled = false;
    } else if (ev.type === "error") {
      finished = true;
      es.close();
      $("error").textContent = ev.message;
      $("error").hidden = false;
      $("status").textContent = "The run stopped.";
      go.disabled = false;
    }
  };
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true;
  $("run").hidden = false; $("error").hidden = true; $("result").hidden = true;
  $("fill").style.width = "0"; $("status").textContent = "Checking your choices...";
  try {
    const res = await fetch("/api/episodes", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({choices: collect()}),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    watch(body.id);
  } catch (err) {
    $("error").textContent = err.message; $("error").hidden = false;
    $("status").textContent = "Not started."; go.disabled = false;
  }
});

loadOptions();
</script>
</body>
</html>
